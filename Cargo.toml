[package]
name = "lsdoc"
version = "0.5.10"
edition = "2021"
license = "AGPL-3.0-only"
description = "A native-Rust parser for Logseq-flavored Markdown and Org: a transcription of Logseq's mldoc (AGPL-3.0), behavior-equivalent to it."
repository = "https://github.com/martinkoutecky/lsdoc"

[dependencies]
memchr = "2"
phf = { version = "0.11", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
